
apiVersion: apps/v1

kind: Deployment

metadata:

  name: redis

  labels:

    app: ticketing

    component: redis

spec:

  replicas: 1

  selector:

    matchLabels:

      app: ticketing

      component: redis

  template:

    metadata:

      labels:

        app: ticketing

        component: redis

    spec:

      containers:

        - name: redis

          image: docker.io/library/redis:alpine

          command: ["redis-server", "--appendonly", "no", "--save", ""]

          ports:

            - containerPort: 6379

          resources:

            requests:

              cpu: "50m"

              memory: "64Mi"

            limits:

              cpu: "200m"

              memory: "128Mi"

          readinessProbe:

            exec:

              command: ["redis-cli", "ping"]

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            exec:

              command: ["redis-cli", "ping"]

            initialDelaySeconds: 10

            periodSeconds: 20

---

apiVersion: v1

kind: Service

metadata:

  name: redis

  labels:

    app: ticketing

    component: redis

spec:

  selector:

    app: ticketing

    component: redis

  ports:

    - port: 6379

      targetPort: 6379

