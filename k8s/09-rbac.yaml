apiVersion: v1

kind: ServiceAccount

metadata:

  name: api-sa

  labels:

    app: ticketing

    component: api

# automountServiceAccountToken: false - api ne poziva Kubernetes API,

# pa mu token za autentifikaciju prema clusteru nije potreban.

automountServiceAccountToken: false

---

apiVersion: v1

kind: ServiceAccount

metadata:

  name: worker-sa

  labels:

    app: ticketing

    component: worker

automountServiceAccountToken: false

---

apiVersion: v1

kind: ServiceAccount

metadata:

  name: frontend-sa

  labels:

    app: ticketing

    component: frontend

automountServiceAccountToken: false
