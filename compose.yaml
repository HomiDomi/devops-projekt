
name: ticketing



services:

  postgres:

    image: postgres:16-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${POSTGRES_DB:-ticketing}

      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:

      - "5432:5432"

    volumes:

      - pgdata:/var/lib/postgresql/data

      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketing_user} -d ${POSTGRES_DB:-ticketing}"]

      interval: 5s

      timeout: 5s

      retries: 10

    networks: [backend]



  redis:

    image: redis:7-alpine

    restart: unless-stopped

    command: ["redis-server", "--save", "", "--appendonly", "no"]

    ports:

      - "6379:6379"

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 5s

      retries: 10

    networks: [backend]



  api:

    build:

      context: ./api

      target: runtime

    restart: unless-stopped

    environment:

      API_PORT: ${API_PORT:-8080}

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: ${POSTGRES_DB:-ticketing}

      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      REDIS_HOST: redis

      REDIS_PORT: 6379

      QUEUE_NAME: ${QUEUE_NAME:-ticket_orders}

      NODE_ENV: ${NODE_ENV:-development}

    ports:

      - "${API_PORT:-8080}:8080"

    volumes:

      - ./api/src:/app/src:ro

    command: ["node", "--watch", "src/index.js"]

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

    networks: [backend]



  worker:

    build:

      context: ./worker

      target: runtime

    restart: unless-stopped

    environment:

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: ${POSTGRES_DB:-ticketing}

      POSTGRES_USER: ${POSTGRES_USER:-ticketing_user}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      REDIS_HOST: redis

      REDIS_PORT: 6379

      QUEUE_NAME: ${QUEUE_NAME:-ticket_orders}

    volumes:

      - ./worker/src:/app/src:ro

    command: ["node", "--watch", "src/index.js"]

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

    networks: [backend]



  frontend:

    build:

      context: ./frontend

      target: runtime

    restart: unless-stopped

    environment:

      FRONTEND_PORT: ${FRONTEND_PORT:-3000}

      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}

    ports:

      - "${FRONTEND_PORT:-3000}:3000"

    volumes:

      - ./frontend/src:/app/src:ro

      - ./frontend/public:/app/public:ro

    command: ["node", "--watch", "src/server.js"]

    depends_on:

      - api

    networks: [backend]



networks:

  backend:

    driver: bridge



volumes:

  pgdata:

